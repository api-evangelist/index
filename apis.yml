aid: index
name: Index
description: >-
  Index is the company behind Alloy (alloy.app), an AI-native product-planning and
  prototyping platform that lets product managers turn any live web app into a
  pixel-perfect, editable prototype in seconds and ship experiments on real data instead
  of static mock-ups. Founded by Simon Kubica (ex-Atlassian) and Christian Iacullo
  (ex-Canva), the company was originally launched as "Index" at index.inc and has since
  rebranded the product to Alloy. It unifies customer feedback, engineering execution
  (deep Linear and Jira integration), and design mocks into one workspace of whiteboards,
  tables, boards, and roadmaps, and exposes an Alloy MCP server so assistants like Claude
  and Codex can read session design, chat, and code context to accelerate developer
  handoff. Index is a seed-stage company backed by Bain Capital Ventures. This profile
  was added to the API Evangelist network as a portfolio-lead stub and enriched from
  public developer and security surfaces.
